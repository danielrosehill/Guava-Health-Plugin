[project]
name = "guava-cli"
version = "0.6.0"
description = "Unofficial Guava Health API client for agents (OAuth 2.1, per-profile grants for family plans) plus a DIY Guava Tag NFC writer. Not made by Guava Health, Inc."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
nfc = ["pyscard>=2.0"]
# MCP SDK 2.x renamed FastMCP internals; pin to 1.x until tested.
mcp = ["mcp>=1.10,<2"]

[project.scripts]
guava = "guava_cli.cli:main"
guava-nfc = "guava_cli.nfc:main"
guava-mcp = "guava_cli.mcp_server:main"

[project.urls]
Repository = "https://github.com/danielrosehill/Guava-Health-Plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guava_cli"]
